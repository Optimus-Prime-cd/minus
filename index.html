<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Avatar Viewer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    
    body { 
      margin: 0; 
      overflow: hidden; 
      background: #000; 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    }
    
    #app { 
      width: 100vw; 
      height: 100vh; 
      touch-action: pan-x pan-y;
      position: relative;
    }
    
    #loading, #error {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      text-align: center;
      z-index: 1000;
      padding: 20px;
      background: rgba(0, 0, 0, 0.9);
      border-radius: 12px;
      max-width: 90%;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }
    
    #error {
      color: #ff4444;
      display: none;
      max-height: 80vh;
      overflow-y: auto;
    }

    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 14px;
      font-weight: 500;
    }

    .progress-bar {
      width: 200px;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #2196F3, #00BCD4);
      width: 0%;
      transition: width 0.3s ease;
    }
    
    .error-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .error-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .error-message {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.8);
      margin-bottom: 16px;
      word-wrap: break-word;
    }

    .error-details {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.5);
      margin-top: 12px;
      padding: 12px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 6px;
      text-align: left;
      font-family: 'Courier New', monospace;
      word-break: break-all;
      max-height: 200px;
      overflow-y: auto;
    }
    
    .retry-btn {
      margin-top: 16px;
      padding: 12px 24px;
      background: linear-gradient(135deg, #2196F3, #1976D2);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 2px 8px rgba(33, 150, 243, 0.3);
    }
    
    .retry-btn:active {
      transform: scale(0.95);
    }

    .retry-btn:hover {
      box-shadow: 0 4px 12px rgba(33, 150, 243, 0.5);
    }

    #debug {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.8);
      color: #0f0;
      padding: 10px;
      font-family: 'Courier New', monospace;
      font-size: 10px;
      border-radius: 4px;
      max-width: 90%;
      max-height: 200px;
      overflow-y: auto;
      display: none;
      z-index: 999;
    }

    .debug-line {
      margin: 2px 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <div class="loading-text">Initializing...</div>
    <div class="progress-bar">
      <div class="progress-fill" id="progress"></div>
    </div>
  </div>
  
  <div id="error"></div>
  <div id="debug"></div>
  <div id="app"></div>

  <script async src="https://ga.jspm.io/npm:es-module-shims@1.8.0/dist/es-module-shims.js"></script>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.150.1/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.150.1/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    // ============================================
    // CONFIGURATION
    // ============================================
    const DEFAULT_ANIMATION_URL = 'https://raw.githubusercontent.com/Optimus-Prime-cd/minus/main/F_Standing_Idle_Variations_003.fbx';

    // ============================================
    // DEBUG & LOGGING
    // ============================================
    const DEBUG = new URLSearchParams(window.location.search).get('debug') === 'true';
    const debugPanel = document.getElementById('debug');
    if (DEBUG) debugPanel.style.display = 'block';

    function log(emoji, message, data = '') {
      const timestamp = new Date().toLocaleTimeString();
      const msg = `${emoji} [${timestamp}] ${message}`;
      console.log(msg, data);
      
      if (DEBUG) {
        const line = document.createElement('div');
        line.className = 'debug-line';
        line.textContent = `${msg} ${data}`;
        debugPanel.appendChild(line);
        debugPanel.scrollTop = debugPanel.scrollHeight;
      }
    }

    // ============================================
    // IMPORT THREE.JS
    // ============================================
    let THREE, GLTFLoader, FBXLoader, OrbitControls;

    try {
      log('📦', 'Loading Three.js modules...');
      
      const modules = await Promise.all([
        import('three'),
        import('three/addons/loaders/GLTFLoader.js'),
        import('three/addons/loaders/FBXLoader.js'),
        import('three/addons/controls/OrbitControls.js')
      ]);

      THREE = modules[0];
      GLTFLoader = modules[1].GLTFLoader;
      FBXLoader = modules[2].FBXLoader;
      OrbitControls = modules[3].OrbitControls;

      log('✅', 'Three.js modules loaded successfully');
    } catch (error) {
      log('❌', 'Failed to load Three.js:', error.message);
      showError(
        'Module Loading Failed',
        'Could not load 3D engine. Please check your internet connection.',
        error.message
      );
      throw error;
    }

    // ============================================
    // GET PARAMETERS FROM URL
    // ============================================
    const urlParams = new URLSearchParams(window.location.search);
    const modelUrl = urlParams.get('modelUrl') || urlParams.get('avatar');
    const animUrl = urlParams.get('animUrl') || urlParams.get('animation');
    
    const finalAnimUrl = animUrl || DEFAULT_ANIMATION_URL;
    
    log('🔍', 'Model URL:', modelUrl);
    log('🔍', 'Animation URL:', finalAnimUrl);
    log('ℹ️', 'Using default animation:', !animUrl);

    if (!modelUrl) {
      showError(
        'No Model URL',
        'Please provide a model URL in the query parameters.',
        'Usage: ?modelUrl=YOUR_GLB_URL&animUrl=YOUR_FBX_URL (optional)'
      );
      throw new Error('Missing modelUrl parameter');
    }

    // ============================================
    // HELPER FUNCTIONS
    // ============================================
    function updateLoading(text, progress = null) {
      document.querySelector('.loading-text').textContent = text;
      if (progress !== null) {
        document.getElementById('progress').style.width = progress + '%';
      }
    }

    function showError(title, message, details = '') {
      document.getElementById('loading').style.display = 'none';
      const errorDiv = document.getElementById('error');
      errorDiv.style.display = 'block';
      
      errorDiv.innerHTML = `
        <div class="error-icon">⚠️</div>
        <div class="error-title">${title}</div>
        <div class="error-message">${message}</div>
        ${details ? `<div class="error-details">${details}</div>` : ''}
        <button class="retry-btn" onclick="location.reload()">Retry</button>
      `;
      
      log('❌', title, message);
    }

    function hideLoading() {
      setTimeout(() => {
        const loadingEl = document.getElementById('loading');
        loadingEl.style.opacity = '0';
        loadingEl.style.transition = 'opacity 0.3s ease';
        setTimeout(() => {
          loadingEl.style.display = 'none';
        }, 300);
      }, 500);
    }

    // ============================================
    // SETUP THREE.JS SCENE
    // ============================================
    log('🎬', 'Initializing 3D scene...');

    const getSize = () => ({
      width: window.innerWidth,
      height: window.innerHeight,
    });

    const renderer = new THREE.WebGLRenderer({ 
      antialias: true,
      alpha: true,
      powerPreference: "high-performance",
      preserveDrawingBuffer: true
    });
    
    const { width, height } = getSize();
    const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);

    // Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
    directionalLight.position.set(5, 10, 7.5);
    directionalLight.castShadow = true;
    
    const fillLight = new THREE.DirectionalLight(0xffffff, 0.3);
    fillLight.position.set(-5, 0, -5);
    
    const backLight = new THREE.DirectionalLight(0xffffff, 0.2);
    backLight.position.set(0, 5, -5);
    
    scene.add(ambientLight, directionalLight, fillLight, backLight);

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(width, height);
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1;
    renderer.shadowMap.enabled = true;
    
    camera.position.set(0, 1.6, 3);
    camera.lookAt(0, 1, 0);

    log('✅', 'Scene initialized');

    // ============================================
    // ORBIT CONTROLS
    // ============================================
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance = 1;
    controls.maxDistance = 10;
    controls.target.set(0, 1, 0);
    controls.enablePan = true;
    controls.enableZoom = true;
    controls.update();

    log('✅', 'Controls initialized');

    // ============================================
    // LOADERS
    // ============================================
    const gltfLoader = new GLTFLoader();
    const fbxLoader = new FBXLoader();

    let mixer;
    let avatar;
    let clock = new THREE.Clock();

    // ============================================
    // LOAD GLB AVATAR
    // ============================================
    log('📥', 'Loading GLB model...');
    updateLoading('Loading Avatar...', 0);

    gltfLoader.load(
      modelUrl,
      
      // ✅ SUCCESS - FORCE EXTERNAL FBX ANIMATION
      function (gltf) {
        log('✅', 'GLB loaded successfully');
        avatar = gltf.scene;
        
        // Center and scale
        const box = new THREE.Box3().setFromObject(avatar);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());
        
        avatar.position.x = -center.x;
        avatar.position.y = -box.min.y - 0.2;
        avatar.position.z = -center.z;
        
        const maxDim = Math.max(size.x, size.y, size.z);
        if (maxDim > 0) {
          const scale = 2 / maxDim;
          avatar.scale.setScalar(scale);
        }
        
        scene.add(avatar);
        log('✅', 'Avatar added to scene');
        
        // ✅ LOG EMBEDDED ANIMATIONS BUT DON'T USE THEM
        if (gltf.animations && gltf.animations.length > 0) {
          log('ℹ️', `Found ${gltf.animations.length} embedded animation(s) - IGNORING`);
          gltf.animations.forEach((anim, index) => {
            log('📋', `  [${index}] ${anim.name} (${anim.duration.toFixed(2)}s)`);
          });
        } else {
          log('ℹ️', 'No embedded animations found');
        }
        
        // ✅ LOG SKELETON BONES (only in debug mode)
        if (DEBUG) {
          log('🦴', '========== Skeleton Structure ==========');
          let boneCount = 0;
          avatar.traverse((child) => {
            if (child.isBone) {
              log('🦴', `  ${child.name}`);
              boneCount++;
            }
          });
          log('🦴', `========== Total bones: ${boneCount} ==========`);
        }
        
        // ✅ ALWAYS LOAD EXTERNAL FBX ANIMATION
        log('🎬', 'Loading external FBX animation (forced)...');
        loadAnimation(finalAnimUrl);
      },
      
      // Progress
      function (xhr) {
        if (xhr.lengthComputable) {
          const percent = Math.round((xhr.loaded / xhr.total) * 100);
          updateLoading(`Loading Avatar... ${percent}%`, percent);
          log('📊', `Progress: ${percent}%`);
        } else {
          const loadedMB = (xhr.loaded / 1024 / 1024).toFixed(2);
          updateLoading(`Loading... ${loadedMB}MB`);
        }
      },
      
      // Error
      function (error) {
        log('❌', 'GLB load failed:', error);
        showError(
          'Failed to Load Avatar',
          'Could not load the 3D model. The file may be corrupted or the URL is incorrect.',
          `URL: ${modelUrl}\n\nError: ${error.message || error}`
        );
      }
    );

    // ============================================
    // LOAD ANIMATION (FBX) - WITH AUTO-RETARGETING
    // ============================================
    function loadAnimation(url) {
      log('📥', 'Loading animation from:', url);
      updateLoading('Loading animation...');
      
      if (!avatar) {
        log('❌', 'Avatar not loaded yet');
        hideLoading();
        return;
      }
      
      fbxLoader.load(
        url,
        
        // Success
        function (fbx) {
          log('✅', 'FBX loaded successfully');
          log('🎬', 'FBX animations:', fbx.animations ? fbx.animations.length : 0);
          
          // Find skinned mesh
          let skinnedMesh;
          avatar.traverse((child) => {
            if (child.isSkinnedMesh && !skinnedMesh) {
              skinnedMesh = child;
              log('✅', 'Found SkinnedMesh:', child.name);
            }
          });

          if (!skinnedMesh) {
            log('❌', 'No SkinnedMesh found - avatar cannot be animated');
            hideLoading();
            return;
          }

          if (!fbx.animations || fbx.animations.length === 0) {
            log('❌', 'FBX file contains no animations');
            hideLoading();
            return;
          }

          const clip = fbx.animations[0];
          log('🎬', 'Original animation name:', clip.name);
          log('🎬', 'Animation duration:', clip.duration.toFixed(2), 'seconds');
          log('🎬', 'Original tracks count:', clip.tracks.length);
          
          // ✅ RETARGET TRACKS - Remove "mixamorig:" prefix
          const retargetedTracks = [];
          let mappedCount = 0;
          let skippedCount = 0;
          
          clip.tracks.forEach((track) => {
            // Extract bone name and property
            const parts = track.name.split('.');
            let boneName = parts[0];
            const property = parts[1]; // position, quaternion, scale
            
            // ✅ REMOVE "mixamorig:" PREFIX
            if (boneName.startsWith('mixamorig:')) {
              boneName = boneName.replace('mixamorig:', '');
            }
            
            // Check if this bone exists in avatar skeleton
            let boneExists = false;
            avatar.traverse((child) => {
              if (child.isBone && child.name === boneName) {
                boneExists = true;
              }
            });
            
            if (boneExists) {
              // Create new track with cleaned bone name
              const newTrackName = `${boneName}.${property}`;
              const newTrack = track.clone();
              newTrack.name = newTrackName;
              
              // ✅ Scale position values (Mixamo uses cm, we use m)
              if (property === 'position') {
                for (let i = 0; i < newTrack.values.length; i++) {
                  newTrack.values[i] = newTrack.values[i] / 100;
                }
              }
              
              retargetedTracks.push(newTrack);
              mappedCount++;
            } else {
              skippedCount++;
              if (DEBUG) {
                log('⚠️', `Bone not found: ${boneName} (original: ${parts[0]})`);
              }
            }
          });
          
          log('✅', `Mapped ${mappedCount} tracks, skipped ${skippedCount}`);
          
          if (retargetedTracks.length === 0) {
            log('❌', 'No tracks could be mapped - skeleton mismatch');
            hideLoading();
            return;
          }
          
          // Create new clip with retargeted tracks
          const retargetedClip = new THREE.AnimationClip(
            clip.name + '_retargeted',
            clip.duration,
            retargetedTracks
          );
          
          // Play animation
          mixer = new THREE.AnimationMixer(skinnedMesh);
          const action = mixer.clipAction(retargetedClip);
          action.play();
          
          log('✅', `🎬 External FBX animation is now playing!`);
          log('✅', `Applied ${retargetedTracks.length}/${clip.tracks.length} tracks`);
          hideLoading();
        },
        
        // Progress
        function (xhr) {
          if (xhr.lengthComputable) {
            const percent = Math.round((xhr.loaded / xhr.total) * 100);
            updateLoading(`Loading animation... ${percent}%`);
            log('📊', `FBX loading: ${percent}%`);
          }
        },
        
        // Error
        function (error) {
          log('❌', 'FBX load failed:', error.message);
          log('❌', 'FBX URL:', url);
          showError(
            'Animation Load Failed',
            'Could not load the FBX animation file. Avatar will display without animation.',
            `URL: ${url}\n\nError: ${error.message}`
          );
        }
      );
    }

    // ============================================
    // ANIMATION LOOP
    // ============================================
    function animate() {
      requestAnimationFrame(animate);
      
      const delta = clock.getDelta();
      
      if (mixer) {
        mixer.update(delta);
      }
      
      controls.update();
      renderer.render(scene, camera);
    }

    animate();
    document.getElementById('app').appendChild(renderer.domElement);
    log('✅', 'Render loop started');

    // ============================================
    // WINDOW RESIZE
    // ============================================
    window.addEventListener('resize', () => {
      const { width, height } = getSize();
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
      log('🔄', 'Window resized');
    });

    // Prevent context menu
    renderer.domElement.addEventListener('contextmenu', (e) => {
      e.preventDefault();
    });

    // Cleanup
    window.addEventListener('beforeunload', () => {
      renderer.dispose();
      controls.dispose();
      log('👋', 'Cleanup completed');
    });

    log('✅', 'Viewer fully initialized');
  </script>
</body>
</html>
